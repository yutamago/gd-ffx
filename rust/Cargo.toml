[workspace]
members = ["ffx-gd", "ffx-import", "ffx-state-cs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/yutamago/gd-ffx"

[workspace.dependencies]
# ffx-rust, the game-logic core. Built from its main branch; a local
# checkout (or a branch not merged yet) goes in as `[patch]` entries
# (FFX_RUST_DIR with tools/build-extension.sh: docs/building.md, "ffx-rust").
ffx-host = { git = "https://github.com/yutamago/ffx-rust", branch = "main", default-features = false }
ffx-bridge = { git = "https://github.com/yutamago/ffx-rust", branch = "main" }
ffx-state = { git = "https://github.com/yutamago/ffx-rust", branch = "main" }
ffx-phyre = { git = "https://github.com/yutamago/ffx-rust", branch = "main" }
ffx-vbf = { git = "https://github.com/yutamago/ffx-rust", branch = "main" }
ffx-text = { git = "https://github.com/yutamago/ffx-rust", branch = "main" }
ffx-kernel = { git = "https://github.com/yutamago/ffx-rust", branch = "main" }
# godot-rust (gdext), MPL-2.0
godot = { version = "0.5.5", features = ["api-4-7"] }
# the same crate as godot's, for `meta::RawPtr` (an audio playback's mix
# buffer; godot does not re-export it): keep the versions equal

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_panics_doc = "allow"

# The game runs inside the extension: even a debug build of the Godot side
# needs ffx-rust optimised (its executor is far too slow at opt-level 0).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
