[package]
name = "ffx-import"
description = "The classic importer: the player's own game files (FFX_Data.vbf) to glTF for Godot (maps, characters, their textures)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
ffx-phyre.workspace = true
ffx-kernel.workspace = true
ffx-text.workspace = true
ffx-vbf.workspace = true
ffx-scene.workspace = true
ffx-script.workspace = true
ffx-dxbc.workspace = true
serde_json.workspace = true
# the Flash movies' art (flash.rs): Ruffle's SWF reader (MIT OR Apache-2.0), zlib
swf = { version = "0.3.0", default-features = false, features = ["flate2"] }
flate2 = "1.1.11"

[lints]
workspace = true
