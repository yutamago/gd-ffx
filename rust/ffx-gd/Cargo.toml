[package]
name = "ffx-gd"
description = "ffx-rust as a Godot GDExtension: the game runs inside Godot, Godot takes the input (docs/architecture.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# No features by default (since 2026-11-17): no Unicorn (ffx-rust runs the whole
# game without it: all 110 developer saves pass gd-ffx's sweep) and no Ruffle
# (gd-ffx draws every screen natively with Godot: docs/architecture.md,
# "Native UI"; the sweep and the self-checks pass without it).
default = []
# Development only, as in ffx-rust: functions without a Rust port run in
# Unicorn from the player's FFX.exe. Unicorn is GPL-2.0: never in a build for
# others (docs/building.md, "Features").
dev-unicorn = ["ffx-host/dev-unicorn"]
# Iggy's Flash screens on Ruffle inside ffx-host (heavy: wgpu), for
# comparing with the original only: gd-ffx shows none of them. Without it the
# Flash screens are null (the start-up logos are skipped either way).
swf = ["ffx-host/swf"]

[dependencies]
ffx-bridge.workspace = true
ffx-host.workspace = true
ffx-import = { path = "../ffx-import" }
ffx-state.workspace = true
ffx-text.workspace = true
godot.workspace = true
serde_json.workspace = true

[lints]
workspace = true
